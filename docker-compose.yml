services:
  keygen:
    image: italia/spid-compliant-certificates:latest
    command: "generator 
      --key-size 3072
      --common-name example
      --days 365
      --entity-id http://localhost:4000
      --locality-name Roma
      --org-id PA:IT-c_h501
      --org-name example
      --sector public
      "
    volumes:
      - config:/certs:rw
  spid:
    image: "italia/spid-saml-check:1.10.4"
    ports:
      - "8443:8443"
    networks:
      spid_test_net:
        ipv4_address: 172.20.0.2
  web:
    build: .
    command: "npm run dev"
    depends_on:
      spid:
        condition: service_started
      keygen:
        condition: service_completed_successfully
    volumes:
      - config:/app/config:ro
      - ./src:/app/src
    environment:
      NODE_TLS_REJECT_UNAUTHORIZED: 0
      IDP: "https://localhost:8443"
      SP: "http://localhost:4000"
      IDP_METADATA_URL: "https://spid:8443/metadata.xml"
      PRIVATE_KEY_FILE: "config/key.pem"
      CERTIFICATE_FILE: "config/crt.pem"
      BINDING: HTTP-Redirect
      SIG_ALG: "sha512"
      AUTHN_CONTEXT: SpidL1
    ports:
      - 4000:4000
      - 9229:9229
    networks:
      spid_test_net:
        ipv4_address: 172.20.0.3

volumes:
  config:

networks:
  spid_test_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
